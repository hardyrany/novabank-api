name: NovaBank CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

    schedule:
        - cron: "0 8 * * 1"

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test123
                    POSTGRES_DB: novabank_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DB_USERNAME: test
            DB_PASSWORD: test123
            DB_NAME: novabank_test

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Cache Maven dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2

            - name: Cache OWASP Dependency Check
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-owasp-

            - name: Build, test, and verify
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: |
                  cd backend/novabank-api
                  ./mvnw clean verify -Dspring.profiles.active=test -DnvdApiKey=$NVD_API_KEY
