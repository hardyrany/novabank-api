spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/novabank_test
        username: admin
        password: admin123
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 2

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false

    flyway:
        enabled: true
        baseline-on-migrate: false
        locations: filesystem:../../database/migration
        clean-disabled: true

logging:
    level:
        com.novabank: INFO
        org.springframework: WARN

jwt:
    secret: test-secret-key-for-testing-only-1234567890
    expiration-ms: 1800000
