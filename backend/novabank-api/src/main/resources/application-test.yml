spring:
    datasource:
        url: jdbc:postgresql://localhost:5433/novabank_test
        username: admin
        password: admin123
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 2

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: false

    flyway:
        enabled: true
        baseline-on-migrate: false
        locations: classpath:db/migration
        clean-disabled: true

logging:
    level:
        com.novabank: INFO
        org.springframework: WARN

jwt:
    # ⚠️ TEST ONLY — not a real secret. Never reuse in production
    secret: test-secret-key-for-testing-only-1234567890
    expiration-ms: 1800000

# ⚠️ TEST ONLY — fake credentials for the bootstrap admin in integration tests.
ADMIN_EMAIL: admin@novabank.local
ADMIN_PASSWORD: TestAdminPass123!
