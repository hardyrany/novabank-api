spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:novabank_dev}
        username: ${DB_USERNAME:admin}
        password: ${DB_PASSWORD:admin123}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 5

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        open-in-view: false

    flyway:
        enabled: true
        baseline-on-migrate: false
        locations: classpath:db/migration
        clean-disabled: true

server:
    port: ${PORT:8080}

logging:
    level:
        com.novabank: INFO
        org.springframework: WARN

jwt:
    secret: ${JWT_SECRET:staging-local-secret-32-chars-minimum}

ADMIN_EMAIL: ${ADMIN_EMAIL:admin@novabank.local}
ADMIN_PASSWORD: ${ADMIN_PASSWORD:ChangeMe123!}